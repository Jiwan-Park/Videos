<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apocalypse Girl – Short Film Landing Page</title>
  <style>
    :root {
      --bg-color-light: #f5f5f7;
      --bg-alt-light: #ffffff;
      --text-color-light: #111111;
      --accent-color-light: #ff4b5c;

      --bg-color-dark: #050509;
      --bg-alt-dark: #111118;
      --text-color-dark: #f5f5f7;
      --accent-color-dark: #ff6b81;

      --radius-lg: 18px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.25);
      --transition-fast: 0.25s ease-out;
      --max-width: 1040px;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg-color: var(--bg-color-light);
      --bg-alt: var(--bg-alt-light);
      --text-color: var(--text-color-light);
      --accent-color: var(--accent-color-light);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-color: var(--bg-color-dark);
      --bg-alt: var(--bg-alt-dark);
      --text-color: var(--text-color-dark);
      --accent-color: var(--accent-color-dark);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #1b1b2f 0, var(--bg-color) 40%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 32px 16px;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .page {
      width: 100%;
      max-width: var(--max-width);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.04),
        rgba(255, 255, 255, 0.02)
      );
      backdrop-filter: blur(18px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow-soft);
      padding: 24px 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: radial-gradient(circle at 30% 20%, #ffe66d 0, #ff4b5c 40%, #7f00ff 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
    }
